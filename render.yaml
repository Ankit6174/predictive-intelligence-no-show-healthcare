services:
  - type: web
    name: node-service
    env: node
    rootDir: node-backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free

  - type: web
    name: python-service
    env: python
    rootDir: python-backend
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    plan: free